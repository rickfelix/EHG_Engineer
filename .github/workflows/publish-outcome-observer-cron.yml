name: "Publish outcome observer (cron)"

# SD-LEO-INFRA-PUBLISH-OUTCOME-OBSERVER-001 — arms
# lib/marketing/observer/observe-outcome.js's observeOutcome() on a schedule, feeding
# the previously-unreachable autonomy graduation rung (recordPublishOutcome()/
# evaluateGraduation() in lib/marketing/autonomy-gate.js had zero production callers
# before this SD). See scripts/cron/publish-outcome-observer.mjs for the ARMED
# registration + per-cycle summary log (periodic_process_registry witness proof).

on:
  schedule:
    # Every 30 minutes -- outcomes should surface reasonably promptly so the
    # autonomy ladder isn't stalled behind a slow-polling observer.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  observe:
    name: Publish-outcome observer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # SECURITY finding SEC-4 (EXEC phase, LOW, least privilege): this is a READ-ONLY job --
    # getPostRecord sends no Authorization header at all, and authenticate() (which needs
    # BLUESKY_HANDLE/BLUESKY_APP_PASSWORD, a credential that can POST) is never reached from
    # the observer path. X_API_KEY is unused too (getTweet reads only accessToken). Exposing
    # posting-capable credentials to a read-only job for nothing is unnecessary blast radius.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run observer (--once)
        run: node scripts/cron/publish-outcome-observer.mjs --once
