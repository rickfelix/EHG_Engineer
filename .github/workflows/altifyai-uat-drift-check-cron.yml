name: AltifyAI UAT Drift Check

# SD-LEO-INFRA-ALTIFYAI-TEST-IDENTITY-001 (FR-7/TS-7, SEC-58): wires the two
# drift-check scripts built for this SD to actual periodic execution -- both
# worked correctly on demand but were wired to nothing recurring, defeating
# "periodic" per their own docstrings (EXEC-TO-PLAN SECURITY finding SEC-58).
#
#  1. scripts/regen-fr7-source-material-fixture.mjs: confirms
#     tests/fixtures/fr7-synthetic-actors-source-material.json still matches
#     the live strategic_directives_v2 row it was generated from.
#  2. scripts/uat-secret-name-drift-check.mjs: confirms the pinned secret-name
#     constant still matches both the chairman's keystrokes document and
#     altifyai's live deploy.yml. Cross-repo (reads rickfelix/altifyai) --
#     fails OPEN with a warning if no cross-repo token is configured, same
#     policy as .github/workflows/design-prompts-cross-repo.yml, since this
#     is an advisory drift guard, not a security gate.
#  3. scripts/altifyai-registry-completeness-check.mjs (SD-LEO-INFRA-STAGE23-
#     WALKER-ELEVEN-OVERRIDES-001 FR-12): confirms every step_id in the live
#     fourteen-journey specification has a registered venture-step-executors.js
#     stepOverride or is on a dated, shrinking allowlist. HARD gate (no
#     continue-on-error), same as step 1 -- the vitest 'db' project cannot host
#     this check (no designated non-prod ref; unit-tier.yml runs it
#     informational-only), so it lives here instead, reusing this workflow's
#     already-real Supabase secrets.

on:
  schedule:
    - cron: '43 6 * * *' # daily, off-peak-ish UTC minute to avoid the :00 stampede
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: FR-7 fixture drift (venture-hosting-standard.md source material)
        run: npm run altifyai:fr7-fixture-drift

      - name: FR-12 registry completeness gate (stage-23 walker step overrides)
        run: npm run altifyai:registry-completeness-check

      - name: TS-7 secret-name drift (keystrokes doc + altifyai deploy.yml)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_CROSS_REPO || secrets.EHG_RO_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No cross-repo token configured (GH_TOKEN_CROSS_REPO / EHG_RO_PAT) -- skipping the TS-7 secret-name drift check (advisory, not a security gate; it needs cross-repo read access to rickfelix/altifyai). Set one of those secrets to enable it."
            exit 0
          fi
          npm run altifyai:uat-secret-drift
