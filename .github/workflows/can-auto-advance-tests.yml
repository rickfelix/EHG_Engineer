name: can-auto-advance tests

# SD-LEO-REFAC-GATE-AUTO-ADVANCE-001 FR-6 / TESTING #5 BLOCKING:
# Neither test:unit nor test:integration runs in CI today. This workflow
# gates the new tests so they cannot rot post-merge.
on:
  pull_request:
    paths:
      - 'lib/eva/stage-execution-worker.js'
      - 'database/migrations/**can_auto_advance**'
      - 'tests/unit/eva/worker-can-auto-advance.test.js'
      - 'tests/integration/eva/can-auto-advance-equivalence.test.js'
      - 'tests/fixtures/can-auto-advance-pre-refactor.snapshot.js'
      - '.github/workflows/can-auto-advance-tests.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: Check integration credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      has_creds: ${{ steps.check.outputs.has_creds }}
    steps:
      - id: check
        # secrets.* is allowed in step-level env, NOT in job-level if. Convert
        # presence-of-secret to a string output so `integration` can gate via
        # `needs.preflight.outputs.has_creds`.
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_KEY" ]]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests (worker mock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run worker._canAutoAdvance unit tests
        run: npx vitest run tests/unit/eva/worker-can-auto-advance.test.js

  integration:
    name: Integration tests (live RPC equivalence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.has_creds == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # See test-sd-creation.yml for the full rationale. Since d031c798 the vitest `db`
      # project's include is [] whenever assessDbTarget is not allowed, and
      # tests/integration/** resolves ONLY under that project — so this step resolved zero
      # files and exited 1, red on main from 15:41Z. Gate it so a gated-off db tier SKIPS
      # visibly instead of failing misleadingly.
      - name: Assess db-tier target
        id: dbgate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          node --input-type=module -e "
          import { assessDbTarget } from './tests/helpers/db-target.js';
          import fs from 'node:fs';
          const r = assessDbTarget();
          console.log('db target assessment: ' + JSON.stringify(r));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'allowed=' + (r.allowed ? 'true' : 'false') + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'reason=' + (r.reason || '') + '\n');
          "

      - name: Run RPC equivalence tests
        if: steps.dbgate.outputs.allowed == 'true'
        run: npx vitest run tests/integration/eva/can-auto-advance-equivalence.test.js

      # Deliberately LOUD — absent coverage must not read as success. Real fix: designate a
      # non-production ref. Do NOT aim VITEST_DB_ALLOW_REF at production.
      - name: DB tier gated off — RPC equivalence tests SKIPPED
        if: steps.dbgate.outputs.allowed != 'true'
        run: |
          echo "::warning title=RPC equivalence tests SKIPPED::db tier gated off (reason: ${{ steps.dbgate.outputs.reason }}). No designated non-production Supabase ref, so these suites did not run. STOPGAP from PR #6527."
          echo "SKIPPED: db tier not allowed (${{ steps.dbgate.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
