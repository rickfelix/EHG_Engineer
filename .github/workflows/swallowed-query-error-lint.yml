name: Swallowed Query Error Lint

# SD-LEO-INFRA-SWALLOWED-POSTGREST-ERROR-001 (FR-4)
# Flags PostgREST calls in GATE/EXECUTOR code whose destructure binds only `data` (or only
# `count`) and discards `error`. PostgREST rejects the WHOLE query on an unknown column, so `data`
# comes back null forever and a caller that never inspects `error` reports a plausible benign
# reason for having done nothing. Zero rows is a legal answer, so the failure is indistinguishable
# from a real empty result — which is why this is a lint plus a wrapper, not a convention.
#
# Live instance this SD fixed: a gate whose PRD lookup failed reached its "no command configured —
# advisory pass" branch. A BROKEN QUERY MADE THE GATE PASS.
#
# Route through lib/db/safe-query.mjs (safeQuery / safeCount), bind `error`, or allowlist
# "<file>:<line>" WITH A REASON in scripts/lint/swallowed-query-error-allowlist.json. The reason is
# mandatory — loadAllowlist() throws without one, because a silence you cannot explain is the
# reflexive kind. The COUNT of allowlist entries is itself a gauge.
#
# SD-LEO-INFRA-WIDEN-SWALLOWED-QUERY-001 (FR-6): ENFORCING as of this SD. The original 32-site
# gate/executor baseline (measured at that SD's authoring; ~232 was a stale figure carried over
# from an earlier, broader draft scope) is now fully converted --
# `node scripts/lint/swallowed-query-error-lint.mjs` reports 0 ungoverned. `continue-on-error` is
# dropped and the run uses `--enforce`, so a PR that reintroduces a data-only destructure in any
# scanned path now fails CI (exit 1), not just logs a warning nobody reads.
#
# This `paths:` list is a SEPARATE, hardcoded mirror of the lint's own SCAN_PREFIXES array
# (scripts/lint/swallowed-query-error-lint.mjs) -- the two must change together in the same PR, or
# a widened scan scope is armed but unreachable (a PR touching only the newly-widened directory
# would never trigger this job). tests/unit/lint/swallowed-query-error-lint-workflow-paths.test.js
# parses THIS FILE and asserts every SCAN_PREFIXES entry has a matching path glob here, so drift
# between the two fails CI (not a comment claiming they're in sync, which cannot detect drift).

on:
  pull_request:
    paths:
      - 'scripts/modules/handoff/**'
      - 'lib/gates/**'
      - 'scripts/modules/claim-health/**'
      - 'lib/claim/**'
      - 'lib/oversight/**'
      - 'scripts/modules/implementation-fidelity/**'
      - 'lib/db/safe-query.mjs'
      - 'scripts/lint/swallowed-query-error-lint.mjs'
      - 'scripts/lint/swallowed-query-error-allowlist.json'
      - '.github/workflows/swallowed-query-error-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swallowed-query-error-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect PostgREST reads that discard `error` in gate/executor code (enforced)
        run: node scripts/lint/swallowed-query-error-lint.mjs --enforce
