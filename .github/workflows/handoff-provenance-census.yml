# SD-LEO-ORCH-CAPA-GATE-EVIDENCE-001-G (FR-1)
#
# CI-asserted census (PRD AC#3: "a scheduled or on-demand job produces this table as a checked
# artifact, not a one-time manual report"). This is descriptive, not a pass/fail gate -- it
# always exits 0; the going-forward pass/fail enforcement lives in FR-5's
# deliverables-provenance-regression-check.yml. Modeled on bypass-ledger-join-check.yml's cron
# shape.

name: Handoff Provenance Census

on:
  schedule:
    # Daily. This is a low-frequency audit signal, not a real-time gate.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: handoff-provenance-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install minimal deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      # Regression proof for the census script's own entrypoint guard (isMainModule()) --
      # a prior sibling script (bypass-ledger-handoff-join-check.mjs) shipped with a guard
      # that was silently dead on Windows. Runs in the dedicated
      # 'handoff-provenance-census-gate' vitest project (vitest.config.js), which stamps fake
      # Supabase credentials at the project level so the runtime db-tier gate
      # (tests/setup.db.js) never loads and never skips it.
      - name: Verify census entrypoint fires
        run: npx vitest run tests/integration/handoff-provenance-census-entrypoint.test.js --project handoff-provenance-census-gate

      - name: Run census
        id: run
        # Non-blocking by design: this script is descriptive, not a gate -- `|| true` so an
        # infra hiccup does not fail the build. The job summary still surfaces the output.
        run: node scripts/ci/handoff-provenance-census.mjs | tee census.json || true

      - name: Job summary
        if: always()
        run: |
          echo "## Handoff Provenance Census — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          # `tee` creates census.json even on zero output, so a plain `cat || fallback`
          # never reaches the fallback (cat on an empty file still exits 0). Check for
          # actual content first.
          if [ -s census.json ]; then
            cat census.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status":"error","note":"no output captured"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
