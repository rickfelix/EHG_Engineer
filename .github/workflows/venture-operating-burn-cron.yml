name: Venture Operating Burn Feed

# Fail-soft scheduled feeder for SD-APEXNICHE-AI-LEO-ORCH-SPRINT-2026-001-E1.
# Isolated from operator-cash-burn-cron.yml by design (separate workflow, separate
# concurrency group) so a hang or failure here can never stall the operator cash/burn
# feed. Idempotent (upsert by venture_id+source_application+period_month) and fail-soft
# (missing credentials, no scriptName, no AI Gateway yet all degrade to an unattested/
# skipped write, never a fabricated value or a job failure).
#
# database/migrations/20260712_venture_operating_burn.sql is applied (confirmed live).
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are NOT yet provisioned as repo secrets
# as of this revision (SD-ALTIFYAI-LEO-ORCH-SPRINT-2026-001-G), so every step below still
# no-ops fail-soft until that credential is provisioned -- an external blocker, tracked
# separately, not worked around here.
#
# SD-ALTIFYAI-LEO-ORCH-SPRINT-2026-001-G: --script-name is now required for a real infra
# measurement (lib/operator/cloudflare-cost-adapter.js closes an account-wide-attribution
# bug that would otherwise misattribute every venture sharing CLOUDFLARE_ACCOUNT_ID to the
# same usage total). AltifyAI step is added inert -- it has no deployed Cloudflare Worker
# yet, so --script-name is intentionally omitted and its infra input stays unattested.

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print, do not write'
        required: false
        default: 'false'

concurrency:
  group: venture-operating-burn-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Feed venture operating burn substrate (ApexNiche AI)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FLAGS="--venture-id 809ec7e7-f688-4a0c-b9f8-c8a8291cf94d --source-application apex_niche_ai --script-name apexniche-ai"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run operator:venture-burn:feed -- $FLAGS --dry-run
          else
            npm run operator:venture-burn:feed -- $FLAGS
          fi

      - name: Feed venture operating burn substrate (AltifyAI)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FLAGS="--venture-id 50763b6a-1fad-4e1e-b2fc-296a1d66ebf9 --source-application altifyai"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run operator:venture-burn:feed -- $FLAGS --dry-run
          else
            npm run operator:venture-burn:feed -- $FLAGS
          fi
