# Weekly clock-skewed unit-tier sweep — SD-LEO-INFRA-CLOCK-SKEW-CI-SWEEP-001 (FR-2).
#
# Runs the SAME unit tier as .github/workflows/unit-tier.yml, but with the system clock pinned
# +45 days forward (TEST_CLOCK_OFFSET_MS, honored by tests/setup.clock-skew.js — see FR-1). Never
# gates a PR (no push/pull_request trigger, scheduled + manual only): a date-window time-bomb
# fixture that would only fail once the real calendar crosses its boundary now surfaces here a
# month early, as a harness_backlog feedback row per failing test, instead of first being
# discovered when it fires on main.
#
# SCOPE LIMIT, stated rather than assumed: this sweep runs the `unit` vitest project, which
# already excludes every tests/quarantine-manifest.json entry (163 files at last measurement) —
# a green run here does not mean "the whole unit tier is time-bomb-free", only the
# currently-passing, non-quarantined slice of it.
name: Unit Tier Clock Skew

on:
  schedule:
    # Sunday 05:00 UTC — one hour ahead of pattern-maintenance-weekly's 06:00 slot, avoiding
    # runner contention while keeping this repo's existing on-the-hour weekly-workflow convention.
    - cron: '0 5 * * 0'
  workflow_dispatch: # allow manual trigger (also used by FR-2 AC-3's own verification)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clock-skew-sweep:
    name: Run Unit Tier at +45 Days
    runs-on: ubuntu-latest
    # FOLLOW-UP FIX (post-merge verification): the first real run (workflow_dispatch,
    # 2026-08-17) was cancelled at the original 25-minute ceiling without completing --
    # confirmed locally too (400s+ under skew vs ~200s unskewed baseline; see
    # tests/setup.clock-skew.js's same-day fix for the ledger truncation race this
    # partly traces to). A timeout cancellation also means the "if: failure()" report
    # step below never runs -- a red/cancelled job with NO harness_backlog row, silently
    # defeating this workflow's entire purpose. Widened with real headroom rather than
    # guessing a second time.
    timeout-minutes: 55

    env:
      TEST_CLOCK_OFFSET_MS: 3888000000 # +45 days, matching the arithmetic pinned by TS-... (45*24*60*60*1000)

    steps:
      # fetch-depth: 0 for the same two reasons unit-tier.yml already carries it: the unit tier's
      # own groundtruth test needs full history, and log-harness-bug.js's findPossiblePriorFix
      # does its own `git log origin/main` lookups on failure.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit project at +45 days (TEST_CLOCK_OFFSET_MS active)
        id: skew_run
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --project unit 2>&1 | tee clock-skew-run.log

      # QF-20260912-364: was `if: failure()`, which does NOT match a CANCELLED job (e.g. the
      # timeout-minutes ceiling above firing) -- the exact way all four real runs of this sweep
      # have ended. `if: always()` plus SKEW_RUN_OUTCOME lets the script itself distinguish a
      # genuine failure (parse the log for FAIL lines) from a cancellation (file "did not
      # complete" instead of silently reporting zero results as if it were a clean pass -- a
      # guard may decline to run but must never report a number it did not take).
      - name: Report time-bombs to the harness backlog (one row per failing file)
        if: always()
        env:
          # Scoped to this step only (SECURITY, EXEC-TO-PLAN finding SEC-2) -- only
          # log-harness-bug.js needs these; neither `npm ci` nor the vitest run step do.
          # Matches log-harness-bug.js's actual read order (SUPABASE_URL ||
          # NEXT_PUBLIC_SUPABASE_URL) -- TR-5.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKEW_RUN_OUTCOME: ${{ steps.skew_run.outcome }}
        run: node scripts/clock-skew-report-failures.mjs clock-skew-run.log

  # SD-LEO-FIX-TESTS-QUARANTINE-MANIFEST-001 FR-3: same weekly schedule, its own independent job
  # (not a step in clock-skew-sweep above -- a red/cancelled unit-tier run must not also block
  # this unrelated manifest check, and vice versa). Asserts the committed baseline count never
  # grows and flags any entry past its review_by with no cited verdict, feeding one harness_backlog
  # row per reason_class cohort (see scripts/lint/quarantine-retire-check.mjs).
  quarantine-retire-check:
    name: Quarantine Manifest Retire-Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run quarantine retire-check gauge
        id: retire_check_run
        run: node scripts/lint/quarantine-retire-check.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # QF-20260912-364's shape, mirrored: `if: always()` so a cancelled/timed-out run step
      # (which would otherwise leave the whole job silently reporting nothing) still files a
      # "did not complete" row -- distinct from the per-reason_class overdue rows the gauge
      # itself emits inline when it runs to completion.
      - name: Report incomplete run (only fires on a non-success/non-failure outcome)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETIRE_CHECK_RUN_OUTCOME: ${{ steps.retire_check_run.outcome }}
        run: node scripts/lint/quarantine-retire-check.mjs --report-incomplete-outcome
