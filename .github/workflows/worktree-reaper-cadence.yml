# QF-20260511-414 wired automation to the reaper script, intending to close a 4th-class witness of
# PAT-LEO-INFRA-WRITER-CONSUMER-ASYMMETRY-001 ("the script existed, no automation invoked it").
#
# CORRECTED BY SD-LEO-INFRA-SCHEDULED-WORKTREE-REAPER-001 — IT DID NOT CLOSE IT. This job runs on a
# GitHub-hosted runner whose fresh clone has no .worktrees/ pool (that path is gitignored), so it
# scans 0 and exits 0 every day. The asymmetry was not closed; it was converted into a daily green
# certification that reaping happens. The scanned==0 guard below now refuses to report success for
# a run that did nothing. Stage 1 only.
#
# RETIRED (QF-20260823-761): the guard above was correct, and its own message is the fix — this
# runner structurally CANNOT observe the pool, so the schedule was failing daily by design
# (2026-08-21/22/23) and filing a spurious issue every time. Removed the `schedule:` trigger; the
# job body stays intact for an explicit human `workflow_dispatch` (never fails on scanned==0, since
# that guard is scoped to scheduled runs only — see "SCHEDULE-ONLY, deliberately" below). Reaping is
# owned exclusively by a separate MACHINE-LOCAL cadence, on the host that actually has .worktrees/ —
# see docs/lib/worktree-reaper/README.md, "Cadence integration (automated)".
name: Worktree Reaper Cadence
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan-only mode (omit --execute)'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
  issues: write
concurrency:
  group: worktree-reaper  # Shared with operator-triggered manual runs.
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install minimal deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit
      - name: Run reaper (Stage 1)
        id: reap
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run worktree:reap 2>&1 | tee reaper.log
          else
            npm run worktree:reap:execute 2>&1 | tee reaper.log
          fi
      # SD-LEO-INFRA-SCHEDULED-WORKTREE-REAPER-001 — A RUN THAT SCANNED NOTHING IS NOT A SUCCESS.
      #
      # MEASURED: this job runs on ubuntu-latest via actions/checkout fetch-depth 1, and .worktrees/
      # is gitignored — so the CI clone contains NO worktree pool and listActiveWorktrees returns
      # exactly 0. Production run 31238967008 executed --execute in 2.45 SECONDS and printed
      # "Stage 1 (auto-safe): 0"; the five preceding scheduled runs all concluded success. It has
      # therefore been GREEN EVERY DAY *BECAUSE* IT DOES NOTHING, while the operator pool it is
      # believed to protect drifted upward untouched.
      #
      # The header above claims this workflow closes PAT-LEO-INFRA-WRITER-CONSUMER-ASYMMETRY-001
      # ("the reaper script existed, no automation invoked it"). Invoking it where no pool exists did
      # not close that asymmetry — it converted it into a daily green certification that reaping
      # happens. A guard that cannot fire must not report success.
      #
      # SCHEDULE-ONLY, deliberately: a manual workflow_dispatch (including dry_run) is a human
      # deliberately exercising the script and should not be failed for the environment it ran in.
      # The scheduled run is the one that gets read as coverage, so that is the one held to account.
      # Failure here is ACTIONABLE, not merely red — the "Open issue on failure" step below already
      # files a ticket naming this run.
      - name: Fail if the scheduled run scanned nothing
        if: github.event_name == 'schedule'
        run: |
          scanned=$(grep -oE 'Worktrees scanned:[[:space:]]*[0-9]+' reaper.log | grep -oE '[0-9]+$' | head -1)
          echo "worktrees_scanned=${scanned:-unparsed}"
          if [ -z "$scanned" ]; then
            echo "::error::Could not parse 'Worktrees scanned:' from reaper.log — the reaper's output shape changed, so this guard is blind. Treating as failure rather than assuming success."
            exit 1
          fi
          if [ "$scanned" -eq 0 ]; then
            echo "::error::Scheduled reaper scanned 0 worktrees. This runner has no pool to reap (.worktrees/ is gitignored and this is a fresh fetch-depth-1 clone), so a green result here certifies nothing. Move this job to a runner that HOSTS the pool (self-hosted), or invoke the reaper from the machine that owns .worktrees/. Until then the operator pool is unprotected by this workflow."
            exit 1
          fi
          echo "Scanned $scanned worktree(s) — this run had a real pool to act on."

      - name: Write last_run_at to state file
        if: always()
        run: |
          node -e "const fs=require('fs'),p=require('path');const f=p.join('.claude','worktree-reaper-state.json');const s=fs.existsSync(f)?JSON.parse(fs.readFileSync(f,'utf8')):{schema_version:1,sweep_counter:0,last_result:null};s.last_run_at=new Date().toISOString();s.last_result='${{ job.status }}';s.sweep_counter=(s.sweep_counter||0)+1;fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,JSON.stringify(s,null,2)+'\n');console.log('last_run_at='+s.last_run_at);"
          {
            echo "## Worktree Reaper Cadence"
            echo "- last_run_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reaper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worktree-reaper-log-${{ github.run_id }}
          path: |
            reaper.log
            .claude/worktree-reaper-state.json
          retention-days: 14
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Worktree Reaper Cadence failed (run ${context.runId})`,
              body: `Scheduled run failed. See logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nClosure: PAT-LEO-INFRA-WRITER-CONSUMER-ASYMMETRY-001 (QF-20260511-414).`,
              labels: ['ci-failure', 'worktree-reaper']
            });
