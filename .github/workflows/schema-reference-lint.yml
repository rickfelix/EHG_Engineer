# Schema-reference lint — blocks NEW code referencing nonexistent tables/columns.
# SD-LEO-INFRA-SCHEMA-REFERENCE-LINT-001 (FR-4). Modeled on metadata-flag-lint.yml.
#
# Diff-only: compares ONLY files changed vs the PR base against the committed
# schema snapshot (database/schema-reference-snapshot.json) — offline, no DB
# credentials needed in CI. The pre-existing phantom backlog (~30 tables /
# 782 column refs, data-layer scan 2026-06-10) never blocks a PR.
#
# BLOCKING (QF-20260704-026): the 7-day advisory soak (merged 2026-06-10, ended
# 2026-06-17) held clean -- the only false-positive reports during the initial
# rollout week (docstring-placeholder flag, whole-file diff-scoping block on
# PR #4595) were both root-caused to the same degraded-diff-base fallback bug
# and fixed by SD-LEO-INFRA-SCHEMA-LINT-DEGRADED-FAILOPEN-001 (completed
# 2026-06-16, one day before soak-end). Zero new reports since. Escapes
# (always available):
#   scripts/lint/schema-reference-allowlist.json  (files / tables)
#   inline pragma: a comment containing schema-lint-disable-line
name: Schema Reference Lint

on:
  pull_request:
    paths:
      - 'scripts/**/*.js'
      - 'scripts/**/*.mjs'
      - 'scripts/**/*.cjs'
      - 'lib/**/*.js'
      - 'lib/**/*.mjs'
      - 'lib/**/*.cjs'
      - 'src/**/*.js'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'server/**'
      - 'api/**'
      - 'app/**'
      - 'database/schema-reference-snapshot.json'
      - 'scripts/lint/schema-reference-*'
      # SD-LEO-ORCH-CAPA-SCHEMA-TRUTH-001-C (FR-3): schema-lint-exit.mjs and
      # schema-lint-escape-budget.mjs do NOT match the schema-reference-* glob above, so without
      # this line a PR editing the exit decision or the escape-budget check itself would not run
      # either of them — the two controls most able to disable this gate would be the two it never
      # saw change.
      - 'scripts/lint/schema-lint-*'
      - '.github/workflows/schema-reference-lint.yml'

concurrency:
  group: schema-reference-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-reference-lint:
    name: schema-reference-lint
    runs-on: ubuntu-latest
    # BLOCKING (soak completed, see header comment) — QF-20260704-026.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run schema-reference lint (diff vs PR base)
        env:
          SCHEMA_LINT_BASE: origin/${{ github.base_ref }}
        run: |
          # QF-20260802-742: do NOT re-shallow the base ref. checkout@v4 above already fetched
          # FULL history (fetch-depth: 0); `--depth=1` here truncated that ref back to a single
          # commit and wrote a .git/shallow boundary, which cripples `git merge-base` — the base
          # of the PR becomes uncomputable and the diff widens to include main's own commits.
          # That is the "merge-commit widening" half of this QF, and it was self-inflicted one
          # line after the full fetch that would have prevented it.
          git fetch origin ${{ github.base_ref }} || true
          node scripts/lint/schema-reference-lint.mjs --diff | tee lint-output.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo "## Schema Reference Lint"
            echo ""
            echo '```'
            cat lint-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code

      # SD-LEO-ORCH-CAPA-SCHEMA-TRUTH-001-C (FR-3): freeze both escape budgets.
      #
      # The lint has exactly two escape hatches — the allowlist and the inline
      # schema-lint-disable-line pragma — and in the final "0 violations" line, a finding SILENCED
      # by one is indistinguishable from a finding FIXED. Once the whole-tree count reaches zero and
      # --all becomes blocking (FR-6), the cheapest route past a red build stops being "repair the
      # reference" and becomes "add one allowlist entry". This step is what notices that.
      #
      # Runs with `if: always()` so a red lint above does not skip the budget check — the run where
      # someone is most tempted to widen an escape is precisely the run where the lint just failed.
      # Both baselines are recomputed from the merge base at run time, never read from a committed
      # literal, because a stored count goes stale silently (this SD watched its own pragma baseline
      # move during LEAD when an unrelated script merely quoted the pragma string).
      - name: Escape-budget freeze (allowlist + inline pragma)
        if: always()
        env:
          SCHEMA_LINT_BASE: origin/${{ github.base_ref }}
        run: |
          node scripts/lint/schema-lint-escape-budget.mjs | tee budget-output.txt
          exit_code=${PIPESTATUS[0]}
          {
            echo "## Schema Lint Escape Budget"
            echo ""
            echo "A finding silenced by an escape is not a finding fixed."
            echo ""
            echo '```'
            cat budget-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code
