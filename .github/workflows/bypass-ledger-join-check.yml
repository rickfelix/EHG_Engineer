# SD-LEO-ORCH-CAPA-GATE-EVIDENCE-001-B (FR-B4)
#
# Scheduled, non-blocking census: bypass_ledger rows written since the join-back fix
# shipped should carry a non-null handoff_id whenever a corresponding sd_phase_handoffs
# row exists. Observe-Only-First for a brand-new predicate (CLAUDE_CORE.md) -- this
# reports, it does not gate merges. Modeled on orphan-qf-reaper.yml's cron shape.

name: Bypass Ledger Join Check

on:
  schedule:
    # Daily. This is a low-frequency audit signal, not a real-time gate.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bypass-ledger-join-check
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install minimal deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Run census
        id: run
        # Non-blocking by design: `|| true` so a bucket-(c) finding does not fail the
        # build during the calibration window. The job summary still surfaces it.
        run: node scripts/ci/bypass-ledger-handoff-join-check.mjs | tee census.json || true

      - name: Job summary
        if: always()
        run: |
          echo "## Bypass Ledger Join Check — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          # `tee` creates census.json even on zero output, so a plain `cat || fallback`
          # never reaches the fallback (cat on an empty file still exits 0). Check for
          # actual content first.
          if [ -s census.json ]; then
            cat census.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"status":"error","note":"no output captured"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
