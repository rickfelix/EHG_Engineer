name: "Michael youtube-digest (durable cron)"

# SD-LEO-ORCH-MICHAEL-ROLE-FORMALIZATION-002-J (FR-4) — v1.1 spec §5 youtube-digest.
#
# Every 15 minutes inside the 06:00-06:30 ET window, no Claude session, NO GOOGLE CREDENTIAL AND NO
# ENCRYPTION KEY (same posture as todoist-brief, ratification 0daf3bd8) and no Todoist token either:
# scripts/michael/youtube-digest.mjs --apply reads the channel list from active michael_rules rows
# (domain='youtube') and scans PUBLIC YouTube RSS feeds — zero API quota, zero credential — staging
# new videos into michael_staged_items (kind youtube_pick). The script is inert outside the window,
# before the chairman applies database/migrations/20260907_michael_v1_1_tables.sql, and while an
# earlier fire of the same ET date is in flight or already ok (lib/michael/feeder.mjs).
#
# Secrets: ONLY the already-provisioned SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY — no Google, no
# OAuth, no encryption key, no Todoist token. tests/unit/cron/michael-youtube-digest-wiring.test.js
# pins that the set of secrets referenced here is EXACTLY those two.
#
# Cron pair with the ET window in the trailing comment (todoist-brief-cron.yml shape): GitHub cron
# is UTC, so the two lines cover EDT and EST; the in-script window gate makes the extra UTC fires inert.

on:
  schedule:
    - cron: '*/15 9-10 * * *'    # 05:00-06:59 EDT (summer) — window 06:00-06:30 ET
    - cron: '*/15 10-11 * * *'   # 05:00-06:59 EST (winter) — window 06:00-06:30 ET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  michael-youtube-digest-apply:
    name: Michael youtube-digest feeder (public RSS scan, stage picks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run youtube-digest (dry-run is the default; --apply executes)
        run: node scripts/michael/youtube-digest.mjs --apply
