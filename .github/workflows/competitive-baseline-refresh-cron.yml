name: "Competitive-baseline refresh (cron)"

# SD: SD-LEO-INFRA-COMPETITIVE-BASELINES-RECURRING-001
#
# Recurring per-venture competitive-baseline refresh, mirroring the existing
# adam-opportunity-scan-cron.yml shape rather than building new scheduler infra. Daily cadence
# (not hourly) -- the eligibility filter currently admits exactly 1 real active venture, and
# each refresh may issue a live Tavily search call, so a tighter cadence would spend API budget
# with no additional signal (expires_at shelf-life is 30 days). FAIL-SOFT: `|| true` keeps a
# refresh error from hard-failing the scheduled job -- this instrument must never block anything
# downstream (Solomon's binding condition, encoded at the packet-read call site, not here).

on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  competitive-baseline-refresh:
    name: Competitive-baseline refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Competitive-baseline refresh
        run: node scripts/eva/competitive-baseline-refresh.mjs || true
