name: "Singleton-relaunch scheduler (cron)"

# RETIRED (QF-20260830-100, chairman ruling A, 2026-08-30): the scheduled trigger is removed.
# The relaunch CONSUMER half was never built — this fired 4x (08-11 x2, 08-22 x2) with ZERO
# relaunches and fed false periodic-liveness escalations. workflow_dispatch is kept for a
# manual dry-run/report-only run; the script and its lib are intentionally NOT deleted, so
# re-adding a `schedule:` block here (and the STANDARD_LOOPS entry it mirrored) re-arms the
# loop if the consumer half is ever built.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  singleton-relaunch:
    name: Singleton-relaunch quiescent-window scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run singleton-relaunch scheduler
        run: npm run singleton-relaunch:run
