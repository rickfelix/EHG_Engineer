name: "Michael brief-assemble (durable cron)"

# SD-LEO-ORCH-MICHAEL-ROLE-FORMALIZATION-002-E (FR-2, FR-4) — spec docs/michael/02-SPEC.md §5, §6.
#
# Every 15 minutes inside the 05:15-06:00 ET window, no Claude session, NO GOOGLE CREDENTIAL: gates
# on assembleReadiness (lib/michael/feeder.mjs) over today's michael_feeder_runs rows, then builds
# and upserts michael_brief_runs.data_json (lib/michael/brief-model.mjs). This script alone must
# produce a complete brief of record whether or not the seat ever wakes — the Drive-doc copy is a
# SEPARATE workflow (michael-brief-doc-cron.yml) so a Drive-side credential issue never blocks this
# path.
#
# Secrets: the already-provisioned SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY. NOTHING ELSE — no
# Google credential, no Todoist token, no encryption key. tests/unit/cron/michael-brief-assemble-wiring.test.js
# pins that the set of secrets referenced here is EXACTLY those two.
#
# Cron pair with the ET window in the trailing comment (michael-todoist-brief-cron.yml shape): GitHub
# cron is UTC, so the two lines cover EDT and EST; the in-script window gate makes the extra UTC fires inert.

on:
  schedule:
    - cron: '*/15 9-10 * * *'    # 05:00-06:45 EDT (summer) — window 05:15-06:00 ET
    - cron: '*/15 10-11 * * *'   # 05:00-06:45 EST (winter) — window 05:15-06:00 ET
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  michael-brief-assemble-apply:
    name: Michael brief-assemble feeder (readiness gate, assemble, render, upsert)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run brief-assemble (dry-run is the default; --apply executes)
        run: node scripts/michael/brief-assemble.mjs --apply
