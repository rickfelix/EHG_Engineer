name: Migration Deploy-Drift Guard

# SD-LEO-INFRA-MIGRATION-DEPLOY-DRIFT-001 FR-2.
# BLOCKING gate: fails loud (non-zero) when a RECENT (date >= RETIRED_BEFORE),
# committed-but-unapplied migration is missing from the live consolidated DB.
# Runs post-merge on main (when a migration or the verifier changes) and daily.
# The deliberately-retired LEGACY backlog stays advisory and never fails the gate.
#
# This gate is a verify-only DRIFT DETECTOR. It does NOT apply migrations and does
# NOT touch the 3-factor @approved-by prod-deploy guard (scripts/lib/migration-guards.js)
# — apply-migration.js --prod-deploy remains the only apply path, with its flag +
# 1h single-use token + `-- @approved-by:<email>` header (matching git user.email)
# preserved exactly. A real DB outage / missing secret (INFRA) is demoted to a
# non-blocking warning so it cannot red-X main; only a genuine recent gap fails.

on:
  push:
    branches: [main]
    paths:
      - 'database/migrations/*.sql'
      # SD-LEO-INFRA-MIGRATION-APPLY-STATE-002 (FR-B): the verifier scans every migration
      # location now — a merge touching only these dirs must re-run the gate too.
      - 'database/functions/*.sql'
      - 'database/manual-updates/*.sql'
      - 'supabase/migrations/*.sql'
      # SD-LEO-INFRA-APPLY-STATE-CEREMONY-PENDING-001 (FR-1): now a scanned root too — a
      # chairman-gated merge must re-run the gate so its CEREMONY_PENDING status is visible
      # promptly instead of waiting for the next unrelated migration push or the daily cron.
      - 'database/chairman-gated/*.sql'
      - 'scripts/verify-migration-apply-state.mjs'
      - 'scripts/lib/migration-guards.js'
      - '.github/workflows/migration-deploy-drift-guard.yml'
      # The disposition ledger and its reader are GATE INPUTS: editing either changes which
      # migrations are suppressed from the fail set. Without these, a push that suppresses
      # migrations — or that changes the suppression LOGIC — would not re-run this gate, and
      # the change would first surface at the next cron, already green.
      - 'docs/audits/migration-dispositions.json'
      - 'scripts/lib/migration-disposition-ledger.mjs'
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC — catches drift even with no migration pushes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-drift:
    name: recent committed-but-unapplied migrations (BLOCKING)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Strict apply-state verifier (recent-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          out="$(node scripts/verify-migration-apply-state.mjs --strict --recent-only 2>&1)"
          code=$?
          echo "$out"
          # MISCONFIG (no DB credential at all) is an operator error, NOT a transient
          # outage — HARD FAIL so the gate can never sit permanently green while never
          # actually checking the live DB.
          # -Fxq, NOT -q: the verifier prints its verdict as a bracketed marker alone on a line,
          # but $out also contains raw migration FILENAMES. An unanchored substring match let a
          # committed file named e.g. 20200101_MIGRATION_APPLY_STATE_INFRA_ERROR_x.sql satisfy
          # the INFRA branch below and exit 0 — permanently silencing this gate, including the
          # daily cron, with a legacy-dated name that is itself never blocking. Fixed-string
          # whole-line matching closes that. (SD-LEO-INFRA-MIGRATION-APPLY-STATE-TRIAGE-001)
          if echo "$out" | grep -Fxq '[MIGRATION_APPLY_STATE_MISCONFIG]'; then
            echo "::error::Deploy-drift gate has NO DB credential — set one of SUPABASE_DB_PASSWORD / SUPABASE_POOLER_URL / DATABASE_URL repo secrets. Failing loud: a credential-less gate verifies nothing."
            exit 1
          fi
          # INFRA = a genuine transient connect failure AFTER a credential was present —
          # non-blocking so an outage cannot red-X main.
          if echo "$out" | grep -Fxq '[MIGRATION_APPLY_STATE_INFRA_ERROR]'; then
            echo "::warning::DB temporarily unreachable — deploy-drift check skipped this run (non-blocking transient)."
            exit 0
          fi
          if [ "$code" != "0" ]; then
            echo "::error::RECENT committed-but-unapplied migration(s) detected (named above). Apply via 'node scripts/apply-migration.js <path> --prod-deploy' (3-factor @approved-by guard) or retire as legacy. Drift must not accumulate."
          fi
          exit "$code"

      # SD-FDBK-ENH-AUTO-APPLY-MIGRATION-001 FR-2/FR-3. The strict check above is loud (::error,
      # non-zero exit) but that verdict only ever reaches CI logs — nothing turns a newly-detected
      # RECENT gap into an actionable ticket, so gaps accumulate (145 of 149 undispositioned at
      # authoring time). This step diffs the current RECENT gap set against the last-recorded
      # baseline and files one feedback row per NEWLY-detected gap (deduplicated against gaps
      # already known from a prior run). Always non-blocking (if: always(), and the script itself
      # never exits non-zero) — it is an accountability enhancement, not a second gate; the strict
      # check above remains the sole blocking verdict.
      - name: New-gap accountability notification (non-blocking)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/migration-gap-notify.mjs

      # SD-LEO-INFRA-MIGRATION-APPLY-STATE-TRIAGE-001 (FR-2). A pure-builder unit test proves
      # buildLedger() is correct; it cannot prove the COMMITTED artifact matches what the
      # seeder would produce today. Only re-running the seeder and diffing does that — without
      # it, a hand-edited ledger silently diverges from its own generator and the suppressions
      # in the gate stop being reproducible. Runs even when the gate above failed (if: always),
      # because a stale ledger is worth reporting exactly when drift exists.
      - name: Disposition ledger is in sync with its seeder
        if: always()
        env:
          # NO service-role key here, deliberately: without --strict/--alert the verifier never
          # emits a breakage alert, and the seeder touches no database at all. This step needs
          # only the read credentials the verifier itself uses.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          node scripts/verify-migration-apply-state.mjs --json > /tmp/apply-state.json 2>/tmp/apply-state.err
          # Branch on the verifier's own MARKER, not on the shape of its output. Inferring
          # "DB unreachable" from a missing '"gaps"' key made every non-DB failure — a syntax
          # error, an OOM, a bad flag — exit 0 while blaming the database. The marker goes to
          # stderr under --json; -Fxq so a filename can never forge it.
          if grep -Fxq '[MIGRATION_APPLY_STATE_INFRA_ERROR]' /tmp/apply-state.err; then
            echo "::warning::DB unreachable — ledger sync check skipped this run (non-blocking transient)."
            exit 0
          fi
          if ! grep -Fq '"gaps"' /tmp/apply-state.json; then
            echo "::error::Verifier produced no usable JSON and did not report a DB outage — this is a real failure, not a transient."
            cat /tmp/apply-state.err
            exit 1
          fi
          set -e
          node scripts/seed-migration-dispositions.mjs --gaps=/tmp/apply-state.json --write
          if ! git diff --quiet -- docs/audits/migration-dispositions.json; then
            echo "::error::docs/audits/migration-dispositions.json is out of sync with its seeder. Re-run 'npm run migration:dispositions:seed -- --gaps=<verifier --json> --write' and commit the result."
            git --no-pager diff -- docs/audits/migration-dispositions.json
            exit 1
          fi
          echo "Ledger is in sync with the seeder."

      # The wiring test proves THIS workflow cannot be failed open by a corrupt ledger, so this
      # workflow is where it belongs. It lives under tests/integration/, which vitest.config
      # routes to the opt-in `db` project — and no workflow runs `npm run test:db` (db-guards.yml
      # runs test:db-GUARDS, a static analyser, which is easy to misread as the same thing). So
      # the SD's only end-to-end safety proof was unreachable in CI: green forever, asserting
      # nothing. Runs AFTER the sync check so its ledger backup/restore can never be mistaken
      # for seeder drift.
      # SD-LEO-INFRA-MIGRATION-APPLY-STATE-002 (FR-C): the proof now RUNS — the test needed no
      # db-project gating at all (it imports no db setup; its only credential consumer is the
      # verifier subprocess, which this step supplies). It executes under the dedicated
      # `migration-gate` vitest project (no setupFiles — see vitest.config.js). THREE-ARM
      # harness/verdict separation: proof ran and passed → OK; proof ran and FAILED → the gate
      # fails (a real verdict); the harness could not run it ("No test files found") → a loud
      # warning that NAMES the harness and exits 0 — a harness failure can neither mask nor
      # impersonate a drift verdict. Before this change the db-project invocation redded this
      # step on every run regardless of verdict (measured: 6/6 recent runs, e.g. 31359162717).
      # Deliberately NOT setting VITEST_DB_ALLOW_REF — that would authorize all db suites
      # against production secrets.
      #
      # MERGE NOTE (supersedes VITEST-TIER-REAL-001's dbgate/skip pair FOR THIS STEP ONLY):
      # that SD made the not-running state explicit (assess designation → run under the db project
      # when allowed, else a loud SKIPPED step). The migration-gate project removes the
      # designation dependency entirely — the proof runs on every gate run, which is strictly
      # stronger than declaring why it did not. The dbgate assessment pattern remains available
      # for suites that genuinely open db clients; this one does not.
      - name: FR-6 fail-open wiring proof
        if: always()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          out="$(npx vitest run tests/integration/migration-apply-state-ledger-wiring.test.js --project migration-gate 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" = "0" ]; then
            exit 0
          fi
          # -Fxq WHOLE-LINE, not -Fq substring (TESTING C2 + SECURITY SEC-1, both reproduced the
          # forgery independently): vitest prints untruncated diff blocks containing gap FILENAMES,
          # so a committed legacy-dated migration named after this phrase would downgrade a REAL
          # wiring-proof failure to a harness warning — the exact class the -Fxq greps above close.
          # vitest emits this exact bare line (od-verified, no ANSI under CI); if vitest ever
          # rewords it, the match fails CLOSED into the error arm — loud, the correct direction.
          if echo "$out" | grep -Fxq 'No test files found, exiting with code 1'; then
            echo "::warning::FR-6 wiring proof DID NOT RUN — the vitest migration-gate project collected zero tests (harness unavailability, not a verdict). The fail-open wiring is UNPROVEN this run; fix the project include before trusting the gate's suppression logic."
            exit 0
          fi
          echo "::error::FR-6 fail-open wiring proof FAILED — the gate's suppression logic is not safe against a corrupt ledger. This is a real verdict, not a harness issue."
          exit "$code"
