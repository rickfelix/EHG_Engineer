name: "Detector-output drain inventory (cron)"

# QF-20260911-080 — additive GHA-backed trigger for STANDARD_LOOPS key `drain-inventory`
# (scripts/coordinator-startup-check.mjs). Always-on so it survives a coordinator session
# death; the STANDARD_LOOPS session-armed entry stays in place unchanged as a redundant
# backup (idempotent — an occasional double-fire is safe per the gauge's own header).

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drain-inventory:
    name: Detector-output drain inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Drain inventory
        run: node scripts/drain-inventory.mjs
