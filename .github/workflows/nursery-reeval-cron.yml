name: "Nursery re-evaluation invoker (cron)"

# SD-EHG-IDEATION-PIPELINE-SEAMS-001 FR-6 — the scheduler the nursery never had.
#
# BREAK 3's measured root cause: no workflow, npm script or config/workers.json worker touched
# venture_nursery. venture-monitor.js registers a job literally NAMED nursery_reevaluation that
# queries eva_ventures instead, from an archived entry point nothing references. The only wired
# traversal was a manual UI dialog nobody triggered — one promotion in 15 days, and
# next_evaluation_at NULL on 16 of 16 rows, which is an empty selection forever rather than a
# healthy zero. This is the "without a human" half of FR-6's acceptance criterion.
#
# WHAT A RUN DOES: selects the top due candidate through the FR-1 authoritative predicate and
# enqueues ONE correctly-shaped stage_zero_requests row attributed to the dedicated service
# principal (AC-10). It is idempotent by design — an open request for the same candidate
# suppresses a second, because enqueueing does not advance next_evaluation_at and an
# unguarded scheduler would queue a duplicate on every tick.
#
# *** THIS WORKFLOW IS OFF UNTIL SOMEONE DELIBERATELY TURNS IT ON. ***
# The job is gated on repository variable NURSERY_REEVAL_ENABLED == 'true', which is UNSET.
# Merging this file therefore arms NOTHING; enabling is a separate, auditable act.
#
# SECURITY REVIEW SEC-1 (HIGH) — why the gate exists, recorded so nobody removes it as noise.
# The first version of this file relied on the stage-zero queue processor not currently running.
# That is a COINCIDENCE, NOT A CONTROL: config/workers.json marks it enabled=true and
# `leo-stack restart` is a documented Essential Command, so any routine fleet restart re-arms
# the drain path. Worse, the dry-run escape hatch did not apply to the case that mattered —
# GitHub evaluates `schedule` events from the DEFAULT BRANCH with an EMPTY `inputs` context, so
# `${{ inputs.dry_run && '1' || '0' }}` yields '0' (LIVE) on every scheduled run. Merging would
# have armed a live 6-hourly enqueue against 16-of-16 eligible nursery rows.
#
# DRAINING AN ENQUEUED REQUEST RUNS THE CREDENTIALED TRAVERSAL — roughly 16 live LLM calls that
# promote a nursery row into a live venture, and stage-zero-queue-processor dispatches it with
# nonInteractive:true, so there is NO chairman gate in the drain path itself. That authorisation
# is the ONLY thing this gate is standing in for. Do not set the variable until it is granted.
#
# Not fail-softed: a genuinely broken invoker must go red. Exit 0 covers every expected outcome
# (enqueued / nothing due / already queued); exit 1 is reserved for real faults.

on:
  schedule:
    # Every 6 hours at :17 — off-minute to spread fleet cron load, matching the adam-*-cron family.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve and validate the request without enqueuing it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A second invoker racing the first could defeat the dedupe read (both see zero open requests
  # before either inserts). Serialise the workflow rather than relying on the check alone.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nursery-reeval-invoke:
    name: Nursery re-evaluation invoker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # SEC-1 KILL SWITCH. Unset variable => this job never runs, on any trigger. Deliberately a
    # repository VARIABLE rather than a code constant: turning it on is a recorded act outside
    # this diff, so "who authorised the first live enqueue" is answerable afterwards.
    if: vars.NURSERY_REEVAL_ENABLED == 'true'

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # `inputs` is EMPTY on schedule events, so this yields '0' (live) for scheduled runs by
      # design — which is safe ONLY because the job gate above is the real control. Manual
      # dispatch can still request a dry run explicitly.
      NURSERY_REEVAL_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Invoke nursery re-evaluation (idempotent enqueue)
        run: node scripts/nursery-reeval-invoker.mjs
