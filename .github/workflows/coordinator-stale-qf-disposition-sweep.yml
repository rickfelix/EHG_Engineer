# SD-LEO-INFRA-STALE-QF-DISPOSITION-SWEEP-001 (FR-9)
#
# Weekly dry-run sweep of open, unclaimed quick_fixes rows past the STALE_QF_DAYS fence,
# after the coordinator has completed the initial bulk --apply pass (H2-controlled,
# chairman-lined). The scheduled trigger NEVER applies -- only a manual workflow_dispatch
# with dry_run explicitly 'false' can request --apply, and --apply still refuses inside the
# script itself (FR-2/FR-8) unless the disposition columns exist live and h2_confirmed is set.

name: Stale QF Disposition Sweep

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If false, run --apply (still requires h2_confirmed). Any trigger other than a manual dispatch with this explicitly set to false always dry-runs.'
        required: false
        default: 'true'
      h2_confirmed:
        description: 'ISO date the coordinator completed the one-time H2 two-sided verification pass (required for --apply; see FR-8)'
        required: false
        default: ''
      seat_count:
        description: 'Override live worker seat-count auto-detection (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: stale-qf-disposition-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Piped through env vars (not spliced directly into the run: script body via ${{ }}) so a
      # workflow_dispatch input containing shell metacharacters cannot inject into the sweep
      # command line.
      EVENT_NAME: ${{ github.event_name }}
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
      H2_CONFIRMED_INPUT: ${{ github.event.inputs.h2_confirmed }}
      SEAT_COUNT_INPUT: ${{ github.event.inputs.seat_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install minimal deps
        run: npm ci --ignore-scripts --prefer-offline --no-audit

      - name: Run sweep
        id: run
        run: |
          # THE CORRECTED GATE (FR-9): POSITIVE and explicit, never a
          # `${{ github.event.inputs.x || 'false' }}`-style fallback. On a `schedule` trigger
          # github.event.inputs is entirely empty/undefined, so that fallback shape silently
          # resolves to a truthy default on every scheduled tick -- the exact
          # .github/workflows/orphan-qf-reaper.yml class of bug this workflow deliberately does
          # NOT copy. Only a workflow_dispatch with dry_run explicitly "false" can request
          # --apply; every other trigger (including schedule) stays dry-run, no fallthrough.
          ARGS="--json"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
            ARGS="$ARGS --apply"
            if [ -n "$H2_CONFIRMED_INPUT" ]; then
              ARGS="$ARGS --h2-confirmed=$H2_CONFIRMED_INPUT"
            fi
          fi
          if [ -n "$SEAT_COUNT_INPUT" ]; then
            ARGS="$ARGS --seat-count $SEAT_COUNT_INPUT"
          fi
          echo "Running: node scripts/coordinator-stale-qf-disposition-sweep.mjs $ARGS"
          node scripts/coordinator-stale-qf-disposition-sweep.mjs $ARGS 2>&1 | tee sweep.log

      - name: Extract summary for job summary
        if: always()
        run: |
          echo "## Stale QF Disposition Sweep — $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          tail -20 sweep.log >> "$GITHUB_STEP_SUMMARY" || echo '{"note":"no output captured"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-qf-disposition-sweep-log-${{ github.run_id }}
          path: sweep.log
          retention-days: 30
